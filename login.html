<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Log in to Mindaural"><title>Log in — Mindaural</title><link rel="stylesheet" href="./theme.css"><link rel="stylesheet" href="./login.css"></head><body><main class="login-shell"><a class="brand" href="./index.html"><img class="logo" src="./assets/logos/Mindaural_logo_final_4x.png" alt="Mindaural"><span>mindaural</span></a><section class="login-card" aria-labelledby="login-title"><div class="login-heading"><p class="eyebrow">MINDAURAL ACCOUNT</p><h1 id="login-title">Welcome back.</h1><p>Log in to continue to your workspace.</p></div><form id="login-form" novalidate><label for="email">Email address<input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required></label><label for="password">Password<span class="password-wrap"><input id="password" name="password" type="password" autocomplete="current-password" minlength="8" required><button type="button" id="toggle-password" aria-label="Show password">Show</button></span></label><div class="form-row"><label class="check"><input id="remember" type="checkbox"> <span>Remember my email</span></label><button class="link-button" type="button" id="forgot">Forgot password?</button></div><div id="form-message" class="form-message" role="status" aria-live="polite"></div><button class="submit" type="submit" id="submit">Log in</button></form><div class="login-divider"><span>New to Mindaural?</span><a href="./demo.html?mode=demo">Try the demo</a></div><p class="auth-note">Authentication connection is ready to be attached. No password is stored by this page.</p></section><p class="legal-note"><a href="./legal/privacy.html">Privacy</a><span>·</span><a href="./legal/terms.html">Terms</a></p></main><script src="./theme.js"></script><script src="./login.js"></script></body></html>
